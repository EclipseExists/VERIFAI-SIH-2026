# VERIFAI — Docker Compose (Local Development)

services:

  # ── PostgreSQL Database ─────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: verifai-db

    environment:
      POSTGRES_USER: verifai
      POSTGRES_PASSWORD: verifai_dev
      POSTGRES_DB: verifai_db

    ports:
      - "5432:5432"

    volumes:
      - verifai_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifai -d verifai_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # ── FastAPI Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile

    container_name: verifai-backend

    environment:
      DATABASE_URL: postgresql+asyncpg://verifai:verifai_dev@postgres:5432/verifai_db
      SECRET_KEY: dev-secret-key-change-in-production
      PYTHONPATH: /app

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ..:/app

    working_dir: /app/backend

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


# ── Named Volumes ─────────────────────────────────────────────────
volumes:
  verifai_pgdata: